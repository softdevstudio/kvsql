[workspace]
resolver = "2"
members = ["crates/kvsql-engine", "crates/kvsql-db"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/softdevstudio/kvsql"
homepage = "https://kvsql.com"
rust-version = "1.89"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
