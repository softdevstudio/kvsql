name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - run: bash scripts/record-results.sh
        env:
          # The neighbours benchmark has its own job below.
          KVSQL_NEIGHBOURS: "0"
      # Job logs can't be read from the agent's sessions; failing test
      # lines come back as annotations instead.
      - if: failure()
        shell: bash
        run: |
          grep -E "panicked|FAILED|failed|error\[|error:" test/results/latest/checks.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: test/results/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - run: cargo test --release --locked -p kvsql-engine

  neighbours:
    # Builds and runs the benchmark against redb, fjall and GlueSQL at a
    # small size so it can't rot. The recorded figures come from
    # scripts/record-results.sh, not from this job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - working-directory: bench/neighbours
        run: |
          cargo fmt -- --check
          cargo clippy --release --locked -- -D warnings
          KVSQL_NEIGHBOURS_ROWS=2000 KVSQL_NEIGHBOURS_COMMITS=20 cargo run --release --locked
